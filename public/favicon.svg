<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Lead/People Icon -->
  <g fill="#FFFFFF">
    <!-- Main Person -->
    <circle cx="50" cy="35" r="10"/>
    <path d="M 35 65 Q 35 50, 50 50 Q 65 50, 65 65 L 65 70 L 35 70 Z"/>

    <!-- Small person left -->
    <circle cx="30" cy="40" r="6" opacity="0.7"/>
    <path d="M 20 65 Q 20 55, 30 55 Q 40 55, 40 65 L 40 68 L 20 68 Z" opacity="0.7"/>

    <!-- Small person right -->
    <circle cx="70" cy="40" r="6" opacity="0.7"/>
    <path d="M 60 65 Q 60 55, 70 55 Q 80 55, 80 65 L 80 68 L 60 68 Z" opacity="0.7"/>
  </g>

  <!-- Lightning bolt accent (for energy/action) -->
  <path d="M 52 20 L 48 32 L 54 32 L 50 42 L 56 30 L 52 30 Z" fill="#FCD34D" opacity="0.9"/>
</svg>
